<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .title{font-size:34px;font-weight:700;fill:#0f172a}
      .sub{font-size:16px;fill:#64748b}
      .stage{font-size:15px;font-weight:700;fill:#475569;letter-spacing:2px}
      .h{font-size:17px;font-weight:700;fill:#0f172a}
      .t{font-size:13.5px;fill:#334155}
      .s{font-size:12px;fill:#64748b}
      .wht{fill:#fff;font-weight:700}
      .flow{stroke:#475569;stroke-width:2.2;fill:none}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="60" y="64" class="title">GlucoTwin — Digital Twin Architecture</text>
  <text x="60" y="92" class="sub">Fusing static EHR with live wearable + CGM to predict hyperglycemia 60–120 minutes ahead</text>
  <line x1="60" y1="108" x2="1540" y2="108" stroke="#e2e8f0" stroke-width="2"/>

  <!-- STAGE LABELS -->
  <text x="60"   y="150" class="stage">DATA STREAMS</text>
  <text x="430"  y="150" class="stage">FEATURE EXTRACTION</text>
  <text x="730"  y="150" class="stage">FUSION</text>
  <text x="980"  y="150" class="stage">TWIN MODEL</text>
  <text x="1300" y="150" class="stage">OUTPUTS</text>

  <!-- A1 static EHR -->
  <rect x="60" y="175" width="310" height="180" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="60" y="175" width="310" height="34" rx="12" fill="#3b82f6"/>
  <text x="76" y="198" class="wht" font-size="15">① STATIC / HISTORICAL — EHR</text>
  <text x="78" y="232" class="t">• Demographics, BMI, ethnicity</text>
  <text x="78" y="254" class="t">• HbA1c, fasting glucose, labs</text>
  <text x="78" y="276" class="t">• Medications (metformin/insulin…)</text>
  <text x="78" y="298" class="t">• Comorbidities (HTN, CKD, retinopathy)</text>
  <text x="78" y="320" class="t">• Family history (genetic-risk proxy)</text>
  <text x="78" y="344" class="s">source: Synthea · MIMIC-IV</text>

  <!-- A2 dynamic wearable -->
  <rect x="60" y="430" width="310" height="180" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <rect x="60" y="430" width="310" height="34" rx="12" fill="#06b6d4"/>
  <text x="76" y="453" class="wht" font-size="13.5">② DYNAMIC / REAL-TIME — Wearable + CGM</text>
  <text x="78" y="487" class="t">• Continuous glucose (CGM)</text>
  <text x="78" y="509" class="t">• Heart rate &amp; HRV (RMSSD)</text>
  <text x="78" y="531" class="t">• Steps / activity</text>
  <text x="78" y="553" class="t">• Sleep stages</text>
  <text x="78" y="575" class="t">• Meal events — sampled every 15 min</text>
  <text x="78" y="599" class="s">source: ShanghaiT2DM · PPG-DaLiA · MMASH</text>

  <!-- B1 -->
  <rect x="430" y="205" width="250" height="120" rx="12" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="446" y="235" class="h">Static feature vector</text>
  <text x="446" y="262" class="t">12 EHR fields, normalized;</text>
  <text x="446" y="284" class="t">encodes chronic risk the</text>
  <text x="446" y="306" class="t">wearable cannot reveal.</text>

  <!-- B2 -->
  <rect x="430" y="455" width="250" height="130" rx="12" fill="#fff" stroke="#67e8f9" stroke-width="2"/>
  <text x="446" y="485" class="h">2-hour window features</text>
  <text x="446" y="512" class="t">CGM level/slope/variability,</text>
  <text x="446" y="534" class="t">HRV, steps, sleep fraction,</text>
  <text x="446" y="556" class="t">recent carbs, time-of-day.</text>

  <!-- C fusion -->
  <rect x="730" y="245" width="190" height="300" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5"/>
  <rect x="730" y="245" width="190" height="36" rx="14" fill="#9333ea"/>
  <text x="748" y="270" class="wht" font-size="15">LATE FUSION</text>
  <text x="748" y="320" class="t" font-weight="700">concatenate</text>
  <text x="748" y="348" class="t">[ dynamic window</text>
  <text x="748" y="370" class="t">&#160;&#160;‖ static EHR ]</text>
  <text x="748" y="410" class="s">One fused vector per</text>
  <text x="748" y="430" class="s">time step. Both streams</text>
  <text x="748" y="450" class="s">required — proven by</text>
  <text x="748" y="470" class="s">the ablation study.</text>

  <!-- D model -->
  <rect x="980" y="225" width="270" height="340" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="980" y="225" width="270" height="36" rx="14" fill="#ea580c"/>
  <text x="998" y="250" class="wht" font-size="15">HYBRID TWIN MODEL</text>
  <text x="998" y="292" class="h">Gradient-Boosted Trees</text>
  <text x="998" y="314" class="t">deployed predictor · interpretable</text>
  <text x="998" y="348" class="h">+ optional LSTM arm</text>
  <text x="998" y="370" class="t">raw-sequence encoder, same</text>
  <text x="998" y="392" class="t">late-fusion head (PyTorch)</text>
  <text x="998" y="426" class="h">Glucose forecaster</text>
  <text x="998" y="448" class="t">+60 min value → Clarke grid</text>
  <text x="998" y="486" class="h">Counterfactual engine</text>
  <text x="998" y="508" class="t">perturb levers → re-score risk</text>
  <text x="998" y="540" class="s">backend: scikit-learn / XGBoost</text>

  <!-- E outputs -->
  <rect x="1300" y="180" width="240" height="96" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1316" y="208" class="h">Adverse-event risk</text>
  <text x="1316" y="232" class="t">hyperglycemia 60–120 min</text>
  <text x="1316" y="254" class="t">ahead · ROC-AUC 0.95</text>

  <rect x="1300" y="296" width="240" height="90" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1316" y="324" class="h">Explainability</text>
  <text x="1316" y="348" class="t">per-alert SHAP drivers</text>
  <text x="1316" y="370" class="t">(wearable + EHR)</text>

  <rect x="1300" y="406" width="240" height="96" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1316" y="434" class="h">What-if simulation</text>
  <text x="1316" y="458" class="t">walk · meds · sleep · meal</text>
  <text x="1316" y="480" class="t">→ actionable recommendation</text>

  <!-- DASHBOARD band -->
  <rect x="430" y="660" width="1110" height="92" rx="14" fill="#0f172a"/>
  <text x="452" y="700" fill="#fff" font-size="18" font-weight="700">CLINICIAN DASHBOARD (Streamlit)</text>
  <text x="452" y="728" fill="#cbd5e1" font-size="14">Virtual-patient view · live glucose &amp; risk curve · alert feed · "why at risk" explanations · what-if controls</text>

  <!-- COMPLIANCE footer -->
  <rect x="60" y="800" width="1480" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="84" y="832" font-size="15" font-weight="700" fill="#0e7490">🔒 Privacy by design</text>
  <text x="84" y="856" font-size="13.5" fill="#155e75">Synthetic / open / anonymized data only · DPDP Act (India) &amp; HIPAA compliant · no real patient data · reproducible from a seed</text>

  <!-- FLOW ARROWS -->
  <path class="flow" marker-end="url(#arrow)" d="M370,265 L428,265"/>
  <path class="flow" marker-end="url(#arrow)" d="M370,520 L428,520"/>
  <path class="flow" marker-end="url(#arrow)" d="M680,265 C705,265 710,330 728,355"/>
  <path class="flow" marker-end="url(#arrow)" d="M680,520 C705,520 710,440 728,415"/>
  <path class="flow" marker-end="url(#arrow)" d="M920,395 L978,395"/>
  <path class="flow" marker-end="url(#arrow)" d="M1250,300 C1275,300 1278,250 1298,235"/>
  <path class="flow" marker-end="url(#arrow)" d="M1250,395 L1298,350"/>
  <path class="flow" marker-end="url(#arrow)" d="M1250,440 C1275,440 1278,452 1298,454"/>
  <path class="flow" marker-end="url(#arrow)" d="M1420,502 C1420,560 1150,600 1010,658"/>
</svg>
